<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Reparo360</title>
  <!-- Quadrado vermelho de largada, canto reto: a marca é reconhecível na aba
       mesmo em 16px, onde desenho fino some. -->
  <rect width="32" height="32" fill="#E23B2E"/>
  <!-- Chave de boca: cabo na diagonal e cabeça aberta em cima, desenhada com
       traço grosso porque em 16px linha fina vira cinza. -->
  <g fill="none" stroke="#FBFAF7" stroke-width="4.2" stroke-linecap="round">
    <path d="M10.5 22 L19 13.5"/>
    <path d="M19.2 8.2 A5.2 5.2 0 1 0 24.6 13.6"/>
  </g>
</svg>
